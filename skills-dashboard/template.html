<style>
/* 레이아웃: 위는 파트별 스킬 지도와 흐름 카드, 프로젝트를 열면 단계 띠(파이프라인) + 대화 + 오른쪽 점검표 */
:root {
  --bg: #eef0f3; --surface: #ffffff; --sunk: #f5f6f8; --ink: #161a22; --muted: #5b6372; --line: #d9dde4;
  --accent: #2c43c4; --accent-soft: #e6e9fb; --on-accent: #ffffff;
  --ok: #17703a; --ok-soft: #e3f3e8; --warn: #9a5b00; --warn-soft: #fbf0dc; --bad: #b42318; --bad-soft: #fde8e6;
  --p-plan: #6b46c1; --p-gen: #c2410c; --p-comp: #b0246f; --p-deck: #0e6f8a; --p-sns: #1d7a40; --p-sales: #876400;
  --f-display: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151b; --surface: #1a1e26; --sunk: #151920; --ink: #e8ebf1; --muted: #9aa3b2; --line: #2c323d;
  --accent: #8b9cff; --accent-soft: #252c4d; --on-accent: #0f1220;
  --ok: #6fd391; --ok-soft: #173023; --warn: #f0b858; --warn-soft: #33270f; --bad: #ff8f84; --bad-soft: #3a1c1a;
  --p-plan: #a98bf0; --p-gen: #f28a55; --p-comp: #ef7ab5; --p-deck: #5cc4dc; --p-sns: #6fcf8e; --p-sales: #d9b84a;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1a1e26; --sunk: #151920; --ink: #e8ebf1; --muted: #9aa3b2; --line: #2c323d;
  --accent: #8b9cff; --accent-soft: #252c4d; --on-accent: #0f1220;
  --ok: #6fd391; --ok-soft: #173023; --warn: #f0b858; --warn-soft: #33270f; --bad: #ff8f84; --bad-soft: #3a1c1a;
  --p-plan: #a98bf0; --p-gen: #f28a55; --p-comp: #ef7ab5; --p-deck: #5cc4dc; --p-sns: #6fcf8e; --p-sales: #d9b84a;
  color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px; }
.wrap { max-width: 1240px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 22px; font-weight: 800; }
h2 { font-size: 17px; font-weight: 800; }
h3 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.04em; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.ghost:hover:not(:disabled) { color: var(--ink); border-color: var(--line); }
button.danger { color: var(--bad); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select, input[type=text], textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
textarea { width: 100%; resize: vertical; line-height: 1.55; }
a { color: var(--accent); }

/* 상단 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding-block: 14px 12px;
  border-bottom: 1px solid var(--line); margin-bottom: 18px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand .mark { font-family: var(--f-mono); font-size: 11px; padding: 2px 6px; border: 1px solid var(--ink); border-radius: 4px; }
.top nav { display: flex; gap: 6px; flex-wrap: wrap; }
.notice { margin-bottom: 14px; padding: 10px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: 13px; }

/* 파트 지도 */
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 26px 0 10px; }
.parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.part { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; border-top: 4px solid var(--pc); min-width: 0; }
.part header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.part header h3 { color: var(--pc); }
.skill-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; width: 100%; text-align: left; border: 0; border-radius: 6px; padding: 7px 8px; background: transparent; }
.skill-row:hover { background: var(--sunk); }
.skill-row .id { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.skill-row .lb { grid-column: 1 / -1; font-size: 14px; }
.need { font-size: 11px; padding: 1px 6px; border-radius: 99px; background: var(--sunk); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }

/* 흐름 카드 */
.flows { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
.flow { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.flow .chain { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 8px; border-radius: 99px; border: 1px solid var(--line); background: var(--sunk); }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--pc, var(--muted)); }
.chain .arrow { color: var(--muted); font-size: 12px; }
.flow footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; gap: 8px; }

/* 프로젝트 목록 */
.runs { display: grid; gap: 8px; }
.run-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; text-align: left; width: 100%; }
.bar { height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden; grid-column: 1 / -1; display: flex; gap: 2px; }
.bar i { flex: 1; background: var(--line); }
.bar i.done { background: var(--ok); } .bar i.active { background: var(--accent); } .bar i.skipped { background: var(--muted); opacity: .35; }
.empty-state { padding: 22px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--muted); text-align: center; }

/* 새 프로젝트 */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.form { display: grid; gap: 16px; max-width: 860px; }
.field { display: grid; gap: 6px; }
.field > label, .field > .label { font-weight: 600; font-size: 14px; }
.wf-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.wf-pick label { display: grid; gap: 2px; border: 1px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer; background: var(--surface); }
.wf-pick input { position: absolute; opacity: 0; pointer-events: none; }
.wf-pick label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.wf-pick label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.builder { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.builder .pool { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
.builder .pool button { font-size: 12px; padding: 4px 9px; border-radius: 99px; display: inline-flex; gap: 6px; align-items: center; }
.builder .pool button::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--pc); }
.builder ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; counter-reset: s; }
.builder li { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; counter-increment: s; }
.builder li::before { content: counter(s, decimal-leading-zero); font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.builder li span { flex: 1; min-width: 0; }
.builder li button { padding: 2px 7px; font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg label { padding: 7px 12px; cursor: pointer; font-size: 14px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--ink); color: var(--bg); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* 프로젝트 화면 */
.run-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
.run-head .tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pipe-wrap { overflow-x: auto; margin-bottom: 14px; padding-bottom: 4px; }
.pipe { display: flex; gap: 6px; min-width: min-content; }
.stage { width: 168px; flex: none; text-align: left; border: 1px solid var(--line); border-left: 4px solid var(--pc); border-radius: 8px; padding: 8px 10px; background: var(--surface); display: grid; gap: 2px; }
.stage .n { font-family: var(--f-mono); font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
.stage .t { font-weight: 600; font-size: 14px; line-height: 1.3; }
.stage .s { font-size: 12px; color: var(--muted); font-family: var(--f-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stage.cur { box-shadow: 0 0 0 2px var(--accent); }
.pill { font-size: 11px; padding: 0 6px; border-radius: 99px; font-family: var(--f-body); }
.pill.todo { background: var(--sunk); color: var(--muted); }
.pill.active { background: var(--accent-soft); color: var(--accent); }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.pill.skipped { background: var(--sunk); color: var(--muted); text-decoration: line-through; }
.workspace { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
@media (max-width: 900px) { .workspace { grid-template-columns: minmax(0, 1fr); } .builder { grid-template-columns: minmax(0, 1fr); } }
.chat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-width: 0; }
.chat-head { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.msgs { padding: 14px; display: grid; gap: 14px; min-height: 220px; }
.msg { min-width: 0; }
.msg .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
.msg.user .body { background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.assistant .body { overflow-wrap: anywhere; }
.md > *:first-child { margin-top: 0; } .md > *:last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3, .md h4 { font-family: var(--f-display); margin: 1.1em 0 .4em; font-size: 15px; }
.md h1, .md h2 { font-size: 16px; }
.md p, .md ul, .md ol { margin: .5em 0; }
.md .tbl { overflow-x: auto; margin: .6em 0; }
.md table { border-collapse: collapse; font-size: 13px; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
.md th { background: var(--sunk); }
.md pre { background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow-x: auto; font-size: 13px; white-space: pre-wrap; }
.md code { font-family: var(--f-mono); font-size: 12.5px; }
.md blockquote { margin: .5em 0; padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
.thinking { color: var(--muted); font-size: 14px; }
.thinking::after { content: "…"; animation: blink 1.2s steps(3) infinite; }
@keyframes blink { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .thinking::after { animation: none; } }
.composer { border-top: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 8px; }
.attach-list { display: flex; flex-wrap: wrap; gap: 6px; }
.attach-list span { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--sunk); border: 1px solid var(--line); }
.composer .row { justify-content: space-between; }
.side { display: grid; gap: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); }
.side .panel { padding: 14px; display: grid; gap: 8px; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
.checks li { display: flex; gap: 8px; }
.checks li::before { content: "○"; color: var(--muted); }
.checks li.y::before { content: "✓"; color: var(--ok); font-weight: 700; }
.checks li.n::before { content: "✕"; color: var(--bad); font-weight: 700; }
#handoff { min-height: 160px; font-size: 13px; font-family: var(--f-body); }
.err { color: var(--bad); font-size: 13px; }

/* 스킬 상세 */
dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--surface); color: var(--ink); width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog::backdrop { background: rgb(10 12 16 / .45); }
.dlg { padding: 18px; display: grid; gap: 12px; }
.dlg header { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.dlg details { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.dlg details pre { white-space: pre-wrap; font-size: 12.5px; max-height: 360px; overflow: auto; margin: 8px 0 0; font-family: var(--f-mono); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: calc(100vw - 32px); }
</style>

<script>
'use strict';
const DATA = JSON.parse(document.getElementById('skills-data').textContent);
const SK = DATA.skills || {};
const GUIDES = DATA.guides || {};

/* ───────── 분류 ───────── */
const PARTS = [
  { id: 'plan',  name: '영상 기획',       color: '--p-plan',  note: '레퍼런스 분해, 컨셉·씬, 카메라 연출',

  'storyboard-deck': '문구·이미지로 스토리보드 제안서', 'sns-concept': '계정 컨셉 시트 (포지셔닝·보이스·필러)',

const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const bytes = s => new TextEncoder().encode(s).length;
const clone = o => JSON.parse(JSON.stringify(o));
const pc = sid => 'var(' + (PART_OF[sid]?.color || '--muted') + ')';
const fmtDate = t => { try { return new Date(t).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600); }
function md(text) {
  if (window.marked && window.DOMPurify) {
    const html = DOMPurify.sanitize(marked.parse(String(text), { gfm: true, breaks: true }));
    return html.replace(/<table>/g, '<div class="tbl"><table>').replace(/<\/table>/g, '</table></div>');
  }
  return '<p style="white-space:pre-wrap">' + esc(text) + '</p>';
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('복사했어요'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove(); toast(ok ? '복사했어요' : '복사가 막혀 있어요. 내보내기를 써 주세요');
  }
}

/* ───────── 저장소: claude.ai db → 브라우저 저장 → 메모리 ───────── */
const Store = {
  mode: 'memory', db: null, base: '', mem: {}, chain: Promise.resolve(),
  async init() {
    const [db, user] = await Promise.all([use('db'), use('user')]);
    if (db && user) {
      try { const id = await user.id(); if (id) { this.db = db; this.base = 'data/users/' + id; this.mode = 'db'; return; } } catch (e) {}
    }
    try { localStorage.setItem('wsd:t', '1'); localStorage.removeItem('wsd:t'); this.mode = 'local'; } catch (e) { this.mode = 'memory'; }
  },
  lget(k) {
    if (this.mode === 'local') { try { const v = localStorage.getItem('wsd:' + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
    return this.mem[k] ?? null;
  },
  lset(k, v) {
    if (this.mode === 'local') {
      try { if (v == null) localStorage.removeItem('wsd:' + k); else localStorage.setItem('wsd:' + k, JSON.stringify(v)); return; }
      catch (e) { toast('브라우저 저장 공간이 부족해요. 오래된 프로젝트를 지워 주세요'); }
    }
    if (v == null) delete this.mem[k]; else this.mem[k] = v;
  },
  queue(fn) { this.chain = this.chain.then(fn).catch(e => { console.error(e); toast('저장하지 못했어요'); }); return this.chain; },
  async list() {
    if (this.mode === 'db') { const q = await this.db.collection(this.base).get(); return q.docs.map(d => ({ ...d.data(), id: d.id })); }
    return (this.lget('index') || []).map(id => this.lget('m:' + id)).filter(Boolean);
  },
  putMeta(m) {
    const body = clone(m);
    return this.queue(async () => {
      if (this.mode === 'db') return this.db.collection(this.base).doc(body.id).set(body);
      const idx = this.lget('index') || []; if (!idx.includes(body.id)) { idx.push(body.id); this.lset('index', idx); }
      this.lset('m:' + body.id, body);
    });
  },
  async getSteps(id, n) {
    const out = Array.from({ length: n }, () => null);
    if (this.mode === 'db') {
      const q = await this.db.collection(this.base + '/' + id + '/steps').get();
      q.docs.forEach(d => { const i = parseInt(d.id.slice(1), 10); if (i < n) out[i] = d.data(); });
    } else for (let i = 0; i < n; i++) out[i] = this.lget('s:' + id + ':' + i);
    return out.map(s => s ? clone(s) : { status: 'todo', messages: [], handoff: '' });
  },
  putStep(id, i, step) {
    const body = clone(step);
    // 문서 하나 256KB 제한: 넘으면 오래된 대화부터 덜어 냄
    while (bytes(JSON.stringify(body)) > 230000 && body.messages.length > 2) body.messages.splice(0, 2, { role: 'user', content: '(앞 대화는 저장 용량 때문에 줄였어요)' });
    return this.queue(async () => {
      if (this.mode === 'db') return this.db.doc(this.base + '/' + id + '/steps/s' + pad(i)).set(body);
      this.lset('s:' + id + ':' + i, body);
    });
  },
  remove(id, n) {
    return this.queue(async () => {
      if (this.mode === 'db') {
        for (let i = 0; i < n; i++) await this.db.doc(this.base + '/' + id + '/steps/s' + pad(i)).delete().catch(() => {});
        return this.db.collection(this.base).doc(id).delete();
      }
      for (let i = 0; i < n; i++) this.lset('s:' + id + ':' + i, null);
      this.lset('m:' + id, null); this.lset('index', (this.lget('index') || []).filter(x => x !== id));
    });
  }
};

  const parts = [];
  parts.push('너는 아래 [스킬] 문서를 작업 설명서로 삼아 일하는 제작 파트너다. 스킬 문서의 절차·질문·멈추는 곳·금지 사항을 그대로 따른다. 답은 한국어로, 쉽게 풀어서, 제목·짧은 줄·표로 나눠 쓴다.');
  parts.push('\n## 실행 환경 (꼭 지킬 것)\n이 대화는 웹 대시보드에서 돌아간다. 파일 만들기, 코드(파이썬) 실행, Higgsfield·노션 같은 연결, 웹 검색, 영상 파일 열기를 할 수 없다. 사용자가 첨부한 이미지와 글만 볼 수 있다.\n- 스킬이 생성 도구를 쓰라고 하면 "연결 없음 / 프롬프트 모드" 경로를 따라 붙여 쓸 프롬프트까지만 낸다.\n- 스크립트 계산·검산이 필요하면 직접 계산해 표로 보여 주고 "스크립트 검산 못 함"이라고 적는다.\n- 파일(.md·.csv·.xlsx·.pptx)을 만들라는 곳에서는 그 내용을 마크다운(표·코드 블록)으로 답에 낸다.\n- "스킬을 호출하라"는 지시는 이 문서를 따르는 것으로 갈음한다.');

  const skill = ['\n## [스킬] ' + st.skill + '\n' + s.body];
  const refs = s.refs.map(x => '\n### [참고 파일] ' + st.skill + '/' + x.path + '\n' + x.text);
  const extras = (st.extra || []).filter(x => SK[x]).map(x => '\n## [함께 쓰는 스킬] ' + x + '\n' + SK[x].body);
  const guide = r.flow.guide && GUIDES[r.flow.guide] ? ['\n## [작업 지침 원문]\n' + GUIDES[r.flow.guide]] : [];

  const ctx = [];
  ctx.push('\n## 워크플로우: ' + r.flow.name + '\n' + r.flow.steps.map((x, k) => (k === i ? '▶ ' : '  ') + (k + 1) + '. ' + x.title + ' (' + x.skill + (x.stage ? ' · ' + x.stage : '') + ')' + (S.steps[k].status === 'done' ? ' ✅' : S.steps[k].status === 'skipped' ? ' (건너뜀)' : '')).join('\n'));
  ctx.push('\n지금은 ' + (i + 1) + '단계 「' + st.title + '」만 한다.' + (st.stage ? ' 스킬 안의 「' + st.stage + '」 단계에 해당한다.' : '') + ' 다음 단계의 일은 하지 않는다.\n완료 조건: ' + st.done.join(' · ') + '\n다음 단계로 넘길 것: ' + st.out);
  ctx.push('\n## 프로젝트: ' + r.name + '\n### 브리프\n' + (r.brief || '(브리프 없음. 필요한 것은 사용자에게 묻는다)'));
  const prev = S.steps.map((x, k) => ({ x, k })).filter(({ x, k }) => k < i && x.status === 'done' && x.handoff.trim());
  let handoffs = prev.map(({ x, k }) => '\n### 앞 단계 결과 — ' + (k + 1) + '. ' + r.flow.steps[k].title + '\n' + x.handoff);
  if (r.auto) ctx.push('\n## 진행 방식: 자동\n사용자에게 묻거나 고르게 하지 말고, 브리프와 앞 단계 결과로 합리적인 선택을 해서 이 단계를 끝까지 마친다. 사용자가 고르는 자리(컨셉 안, 배우 픽 등)는 브리프에 가장 맞는 안을 골라 "가정"으로 표시한다. 사용자가 주지 않은 실적·수치·단가·고객사명·정책은 지어내지 말고 [확인 필요] 빈칸으로 둔다. 이미지·영상 생성처럼 크레딧이 드는 일은 프롬프트까지만 낸다.' + (st.optional ? ' 브리프상 이 단계가 필요 없으면 이유 한 줄을 적고 넘길 것을 "없음"으로 한다.' : ''));
  else ctx.push('\n## 진행 방식: 확인\n스킬 안의 질문·확인은 건너뛰지 않는다. 사용자 답이 필요하면 질문하고 멈춘다. 사용자가 고르거나 확인할 칸을 대신 ✅로 적지 않는다. 앞 단계 결과나 브리프에 이미 답이 있으면 다시 묻지 않는다.');
  const fmt = '\n## 답의 형식\n이 단계를 마칠 수 있게 되면(자동 모드는 매번) 답 맨 끝에 아래 두 제목을 그대로 붙인다. 아직 사용자 답을 기다리는 중이면 붙이지 않는다.\n\n## 완료 조건 점검\n' + st.done.map(d => '- ✅ 또는 ❌ ' + d).join('\n') + '\n\n## 다음 단계로 넘길 것\n(다음 단계가 이것만 읽고 이어 갈 수 있게 결과물 전체를 그대로 적는다. 요약하지 말고 표·프롬프트·씬 번호를 살린다.)';

  // 용량을 넘으면 큰 참고 파일 → 작업 지침 → 함께 쓰는 스킬 → 앞 단계 결과 순으로 줄임
  const assemble = () => parts.concat(skill, refs, extras, guide, ctx, handoffs, [fmt]).join('\n');
  let text = assemble();
  const cut = [];
  while (bytes(text) > budget) {
    if (refs.length) { let k = 0; refs.forEach((x, j) => { if (x.length > refs[k].length) k = j; }); cut.push(refs[k].split('\n')[1]); refs.splice(k, 1); }
    else if (guide.length) { guide.pop(); cut.push('작업 지침'); }
    else if (extras.length) { cut.push(extras.pop().split('\n')[1]); }
    else if (handoffs.some(h => h.length > 6000)) handoffs = handoffs.map(h => h.length > 6000 ? h.slice(0, 6000) + '\n…(길어서 줄임)' : h);
    else break;
    text = assemble();
  }
  if (cut.length) text += '\n\n(용량 때문에 뺀 참고 자료: ' + cut.join(', ') + ' — 필요하면 사용자에게 붙여 달라고 한다)';
  return text;
}
function turnsFor(i) {
  const msgs = S.steps[i].messages.map(m => ({ role: m.role, content: m.content }));
  let used = msgs.reduce((n, m) => n + bytes(m.content), 0);
  while (used > MAX_BYTES * 0.5 && msgs.length > 2) { used -= bytes(msgs[0].content) + bytes(msgs[1].content); msgs.splice(0, 2); }
  if (msgs.length && msgs[0].role === 'assistant') msgs.shift();
  return [{ role: 'user', content: instruction(i, MAX_BYTES - used - 4000) }].concat(msgs);
}
function manualPrompt() {
  const turns = turnsFor(S.cur);
  const draftMsg = $('#composer')?.value.trim();
  return turns.map(t => (t.role === 'assistant' ? '[Claude의 앞선 답]\n' : '') + t.content).join('\n\n---\n\n') + (draftMsg ? '\n\n---\n\n' + draftMsg : turns.length === 1 ? '\n\n---\n\n이 단계를 시작해 줘.' : '');
}

/* ───────── 실행 ───────── */
const ERR = {
  not_granted: '이 페이지가 Claude를 쓰도록 허용되지 않았어요. 허용하면 다시 쓸 수 있어요.',
  sampling_disabled: '이 계정에서는 페이지가 Claude를 쓸 수 없어요.',
  rate_limited: '사용량 한도나 호출 횟수에 걸렸어요. 잠시 뒤 다시 보내 주세요.',
  session_expired: 'claude.ai 로그인이 풀렸어요. 다시 로그인해 주세요.',
  prompt_too_large: '보낼 내용이 너무 커요. 첨부를 줄이거나 앞 단계 결과를 줄여 주세요.',
  image_rejected: '이미지를 받지 못했어요. 다른 파일(JPG·PNG·WebP)로 바꿔 주세요.',
  images_unavailable: '이 화면에서는 이미지를 보낼 수 없어요. 글로 설명해 주세요.',
  refused: 'Claude가 이 요청에 답하지 않았어요. 표현을 바꿔 다시 보내 주세요.',
  empty_completion: '빈 답이 왔어요. 요청을 조금 줄여 다시 보내 주세요.',
  upstream_error: '연결이 잠깐 끊겼어요. 다시 보내 주세요.'
};
async function sendTurn(text, opts = {}) {
  if (S.busy || !S.sample) return false;
  const i = S.cur, step = S.steps[i];
  let content = text || (step.messages.length ? '' : (S.run.auto ? '이 단계를 진행해 줘.' : '이 단계를 시작해 줘.'));
  const files = [];
  S.pending.texts.forEach(t => { content += '\n\n[첨부 글: ' + t.name + ']\n```\n' + t.text + '\n```'; files.push(t.name); });
  const images = S.pending.images.slice();
  images.forEach(f => files.push(f.name));
  if (images.length) content += '\n\n(이미지 ' + images.length + '장 첨부: ' + images.map(f => f.name).join(', ') + ')';
  if (!content.trim()) { toast('보낼 말을 적어 주세요'); return false; }
  step.messages.push({ role: 'user', content: content.trim(), files });
  if (step.status === 'todo') step.status = 'active';
  S.pending = { images: [], texts: [] };
  S.busy = true; S.live = ''; S.ctl = new AbortController();
  saveMeta(); renderRun();
  const liveEl = () => $('#live .body');
  let ok = false;
  try {
    const res = await S.sample(turnsFor(i), {
      signal: S.ctl.signal, cache: false, modelTier: S.run.tier || 'default',
      ...(images.length ? { images } : {}),
      onText: ({ text: t }) => { S.live = t; const el = liveEl(); if (el && S.cur === i) el.innerHTML = md(t); }
    });
    step.messages.push({ role: 'assistant', content: res.text + (res.truncated ? '\n\n> (답이 길어 중간에 끊겼어요. "이어서"라고 보내면 계속해요.)' : '') });
    const h = parseHandoff(res.text); if (h) step.handoff = h;
    ok = true;
  } catch (e) {
    if (e && e.text) step.messages.push({ role: 'assistant', content: e.text + '\n\n> (중간에 멈췄어요)' });
    if (e?.code === 'not_granted' || e?.code === 'sampling_disabled') { S.sample = null; $('#sample-notice').hidden = false; }
    S.lastErr = e?.code === 'cancelled' ? '' : (ERR[e?.code] || ERR.upstream_error);
  } finally {
    S.busy = false; S.live = ''; S.ctl = null;
    await saveStep(i); saveMeta();
    if (!opts.quiet || !ok) { renderRun(); if (S.lastErr) { $('#run-err').textContent = S.lastErr; $('#run-err').hidden = false; } }
    S.lastErr = '';
  }
  return ok;
}
async function autoRun() {
  if (S.autoRunning || S.busy) return;
  S.autoRunning = true;
  const wasAuto = S.run.auto; S.run.auto = true; saveMeta();
  try {
    for (let i = 0; i < S.steps.length && S.autoRunning; i++) {
      const s = S.steps[i]; if (s.status === 'done' || s.status === 'skipped') continue;
      S.cur = i; renderRun();
      const ok = await sendTurn(s.messages.length ? '자동 모드로 바꿨어. 묻지 말고 가정을 표시하면서 이 단계를 끝까지 마쳐 줘.' : '', { quiet: true });
      if (!ok || !S.autoRunning) break;
      if (!s.handoff.trim()) s.handoff = lastAssistant(s);
      s.status = 'done'; await saveStep(i); saveMeta();
    }
  } finally {
    S.autoRunning = false; S.run.auto = wasAuto; saveMeta(); renderRun();
    if (S.steps.every(s => s.status === 'done' || s.status === 'skipped')) toast('모든 단계를 마쳤어요. 내보내기로 받아 보세요');
  }
}

/* ───────── 내보내기 ───────── */
function runMarkdown() {
  const r = S.run;
  const out = ['# ' + r.name, '', '- 흐름: ' + r.flow.name, '- 진행 방식: ' + (r.auto ? '자동' : '확인'), '- 내보낸 때: ' + new Date().toLocaleString('ko-KR'), '', '## 브리프', '', r.brief || '(없음)', '', '## 진행표', '', '| 단계 | 스킬 | 상태 |', '|---|---|---|'];
  r.flow.steps.forEach((s, i) => out.push('| ' + (i + 1) + '. ' + s.title + ' | ' + s.skill + ' | ' + statusName(S.steps[i].status) + ' |'));
  r.flow.steps.forEach((s, i) => {
    const st = S.steps[i];
    out.push('', '---', '', '## ' + (i + 1) + '. ' + s.title + ' (' + s.skill + ')', '', '### 넘길 것', '', st.handoff || '(없음)');
    if (st.messages.length) { out.push('', '### 대화 기록'); st.messages.forEach(m => out.push('', '**' + (m.role === 'user' ? '나' : 'Claude') + '**', '', m.content)); }
  });
  return out.join('\n');
}
async function exportRun() {
  const text = runMarkdown();
  const dl = await use('downloads');
  if (dl) {
    try { await dl.save({ filename: S.run.name.replace(/[\\/:*?"<>|]/g, '_') + '.md', data: text }); toast('파일을 저장했어요'); return; }
    catch (e) { if (e?.code === 'cancelled' || e?.code === 'declined') return; }
  }
  copyText(text);
}

/* ───────── 화면 전환·시작 ───────── */
function show(v) {
  ['home', 'new', 'run'].forEach(x => { $('#view-' + x).hidden = x !== v; });
  if (v === 'home') renderHome();
  window.scrollTo(0, 0);
}
$('#nav-home').onclick = () => { if (!S.busy) show('home'); };
$('#nav-new').onclick = () => { if (!S.busy) showNew(draft.flow); };

renderHome();
(async () => {
  await Store.init();
  $('#store-note').textContent = { db: '· claude.ai 계정에 저장', local: '· 이 브라우저에 저장', memory: '· 저장 안 됨 (창을 닫으면 사라져요)' }[Store.mode];
  try { S.metas = await Store.list(); } catch (e) { S.metas = []; toast('저장된 프로젝트를 불러오지 못했어요'); }
  if (!$('#view-home').hidden) renderHome();
  const sample = await use('sample');
  S.sample = sample;
  if (sample) { try { const lim = await sample.limits(); S.imgLimits = lim.images || null; } catch (e) { S.imgLimits = null; } }
  $('#sample-notice').hidden = !!sample;
  if (S.run && !$('#view-run').hidden) renderRun();
})();
</script>
